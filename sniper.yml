name: PSA Sniper

on:
  schedule:
    # Every 15 minutes (GitHub may start scheduled runs a few minutes late).
    - cron: "*/15 * * * *"
  workflow_dispatch:      # lets you press "Run workflow" manually
    inputs:
      test_discord:
        description: "Only send a TEST alert to Discord (no eBay needed)"
        type: boolean
        default: false

concurrency:
  group: psa-sniper
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Remembers which listings were already alerted, so you don't get repeats.
      - name: Restore alert history
        uses: actions/cache/restore@v4
        with:
          path: state
          key: sniper-state-${{ github.run_id }}
          restore-keys: sniper-state-

      - name: Scan eBay
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
          DISCORD_TEST: ${{ inputs.test_discord && '1' || '' }}
        run: python sniper.py

      - name: Save alert history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: sniper-state-${{ github.run_id }}
